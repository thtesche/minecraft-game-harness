[project]
name = "minecraft-game-harness"
version = "0.1.0"
description = "Laya-gated decision harness for Mine AI MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Laya and the LangGraph decision layer. Separate from the base install so the
# protocol runner can be tested without a multi-hundred-megabyte torch install.
decision = [
    "laya>=0.3.23",
    "laya[langchain]>=0.3.23",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio>=4.0",
]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]